plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.netty:netty-bom:4.2.18.Final')
    implementation 'io.projectreactor.netty:reactor-netty-http:1.3.7'
    implementation 'io.projectreactor:reactor-core:3.8.7'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'
}

application {
    mainClass = 'NettyEventLoop'
}

tasks.register('runNettyEventLoop', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'NettyEventLoop'
}

tasks.register('runCoreSyncSubscribe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CoreSyncSubscribe'
}

tasks.register('runCoreDefer', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CoreDefer'
    mustRunAfter 'runCoreSyncSubscribe'
}

tasks.register('runCoreCreate', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CoreCreate'
    mustRunAfter 'runCoreDefer'
}

tasks.register('runCorePublishOnSchedulerDefault', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CorePublishOnSchedulerDefault'
    mustRunAfter 'runCoreCreate'
}

tasks.register('runCorePublishOnSchedulerWithThread', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CorePublishOnSchedulerWithThread'
    mustRunAfter 'runCorePublishOnSchedulerDefault'
}

tasks.register('runNettyPublishOnSchedulerWithThread', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'NettyPublishOnSchedulerWithThread'
    mustRunAfter 'runNettyPublishOnSchedulerDefault'
}

tasks.register('runNettyEventLoopErrorHook', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'NettyEventLoopErrorHook'
    mustRunAfter 'runNettyEventLoop'
}

tasks.register('runNettyPublishOnSchedulerDefault', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'NettyPublishOnSchedulerDefault'
    mustRunAfter 'runNettyEventLoopErrorHook'
}

tasks.register('runNettyPublishOnSchedulerErrorHook', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'NettyPublishOnSchedulerErrorHook'
    mustRunAfter 'runNettyPublishOnSchedulerWithThread'
}

tasks.register('runCorePublishOnSchedulerErrorHook', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'CorePublishOnSchedulerErrorHook'
    mustRunAfter 'runCorePublishOnSchedulerWithThread'
}

tasks.register('runCoreControls') {
    dependsOn 'runCoreSyncSubscribe', 'runCoreDefer', 'runCoreCreate',
            'runCorePublishOnSchedulerDefault', 'runCorePublishOnSchedulerWithThread',
            'runCorePublishOnSchedulerErrorHook'
}

tasks.register('runNettyControls') {
    dependsOn 'runNettyEventLoop', 'runNettyEventLoopErrorHook',
            'runNettyPublishOnSchedulerDefault', 'runNettyPublishOnSchedulerWithThread',
            'runNettyPublishOnSchedulerErrorHook'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
