plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.netty:netty-bom:4.2.18.Final')
    implementation 'io.projectreactor.netty:reactor-netty-http:1.3.7'
    implementation 'io.projectreactor:reactor-core:3.8.7'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'
}

application {
    mainClass = 'UnresolvedMonoRepro'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
